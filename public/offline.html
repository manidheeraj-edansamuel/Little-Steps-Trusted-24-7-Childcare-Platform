<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f43f5e" />
    <title>Little Steps — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      }
      .card {
        max-width: 26rem;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: #f43f5e;
        color: #fff;
        font-weight: 700;
        margin-bottom: 16px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #475569; margin: 0 0 20px; }
      a {
        display: inline-block;
        background: #f43f5e;
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="mark">LS</span>
      <h1>You are offline</h1>
      <p>
        Little Steps needs a connection to check bookings, payments and live
        feeds. Your saved data is still here when you reconnect.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
